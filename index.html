<script>
const AN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const XI=n=>({"C":0,"C#":1,"Db":1,"D":2,"D#":3,"Eb":3,"E":4,"F":5,"F#":6,"Gb":6,"G":7,"G#":8,"Ab":8,"A":9,"A#":10,"Bb":10,"B":11})[n]||0;

// Piano ALWAYS starts at C, shows C to C (13 semitones = full octave)
// Highlights only the notes passed in
function piano(hl,ac,label){
  const hs=new Set(hl.map(XI));
  // Build preferred display names from highlights
  const dn={};hl.forEach(n=>{dn[XI(n)]=n});
  // 13 semitones starting at C
  const ss=[];for(let i=0;i<13;i++)ss.push(i%12);
  const wk=[],bk=[];let wp=0;
  ss.forEach(s=>{
    const nm=dn[s]||AN[s];
    if([1,3,6,8,10].includes(s)){bk.push({s,wp,nm})}
    else{wk.push({s,p:wp,nm});wp++}
  });
  const W=wk.length,kw=100/W;
  let h='';
  if(label)h+=`<div class="pl">${label}</div>`;
  h+=`<div class="pw">`;
  wk.forEach(k=>{const l=hs.has(k.s);h+=`<div class="wk${l?' hl':''}" style="left:${k.p*kw}%;width:${kw}%;background:${l?ac:'#f5f0e8'}"><span>${k.nm}</span></div>`});
  bk.forEach(k=>{const l=hs.has(k.s);h+=`<div class="bk${l?' hl':''}" style="left:${(k.wp-.35)*kw}%;width:${kw*.65}%;${l?`background:linear-gradient(to bottom,${ac},color-mix(in srgb,${ac},#000 40%));border:1px solid #111;box-shadow:0 2px 8px ${ac}66`:''}"><span>${k.nm}</span></div>`});
  return h+`</div>`;
}

function chord(nm,fs,st,ac){
  const F=4,c=28,ch=26,o=30,y=20,sl=["E","A","D","G","B","e"];
  const w=o+5*c+12,hh=y+F*ch+18;
  let s=`<div style="display:inline-block;vertical-align:top;margin:0 6px 10px"><div style="font-size:12px;font-weight:700;color:#ccc;text-align:center;margin-bottom:4px">${nm}</div>`;
  s+=`<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}">`;
  s+=`<text x="6" y="${y+16}" fill="#fff" font-size="10" font-weight="bold" font-family="monospace">${fs>0?fs+'fr':''}</text>`;
  s+=`<rect x="${o}" y="${y}" width="${5*c}" height="${fs<=1?3:2}" fill="${fs<=1?'#ccc':'#555'}" rx="1"/>`;
  for(let i=0;i<=F;i++)s+=`<line x1="${o}" y1="${y+i*ch}" x2="${o+5*c}" y2="${y+i*ch}" stroke="#444"/>`;
  for(let i=0;i<6;i++)s+=`<line x1="${o+i*c}" y1="${y}" x2="${o+i*c}" y2="${y+F*ch}" stroke="#555"/>`;
  st.forEach((f,i)=>{const cx=o+i*c;if(f===null)s+=`<text x="${cx}" y="${y-5}" text-anchor="middle" fill="#555" font-size="11">×</text>`;
  else if(f===0)s+=`<text x="${cx}" y="${y-5}" text-anchor="middle" fill="#999" font-size="11">○</text>`;
  else{const r=f-fs+1;if(r>=1&&r<=F){const cy=y+(r-.5)*ch;s+=`<circle cx="${cx}" cy="${cy}" r="10" fill="${ac}"/><text x="${cx}" y="${cy+3.5}" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">${f}</text>`}}});
  sl.forEach((l,i)=>{s+=`<text x="${o+i*c}" y="${y+F*ch+14}" text-anchor="middle" fill="#666" font-size="9">${l}</text>`});
  return s+`</svg></div>`;
}

let mode='simple',si=0,ci=0;
let show={scale:true,piano:true,sLow:true,sMid:false,sHi:false,cBasic:false,cUp:false};
function tog(k){show[k]=!show[k];render();}

function render(){
  const list=mode==='simple'?SIMPLE:UPBEAT;
  const idx=mode==='simple'?si:ci;
  const g=list[idx]||list[0];
  const ac=g.ac;
  let h='';

  h+=`<div class="mr"><button class="mb${mode==='simple'?' on':''}" onclick="mode='simple';render()">🎵 Simple</button><button class="mb${mode==='upbeat'?' on':''}" onclick="mode='upbeat';render()">🎉 Upbeat</button></div>`;

  h+=`<div class="tabs">`;
  list.forEach((g2,i)=>{const on=idx===i;h+=`<button class="tab${on?' on':''}" style="${on?`border-color:${g2.ac};color:${g2.ac};background:${g2.ac}15`:''}" onclick="${mode==='simple'?'si':'ci'}=${i};render()">${mode==='simple'?i+1:(i+1)+'*'}</button>`});
  h+=`</div>`;

  h+=`<div class="hdr"><h1 style="color:${ac}">🔥 ${g.t}</h1><div class="bpm">${g.bpm} <span>BPM</span></div></div>`;
  h+=`<div class="vibe">${g.vibe}</div>`;

  // Scale - piano always starts at C
  h+=`<div class="sec"><button class="tog${show.scale?' on':''}" onclick="tog('scale')">🎹 SCALE — ${g.sl}<span class="arr" style="color:${ac}">${show.scale?'▾':'▸'}</span></button><div class="pnl${show.scale?' on':''}">${piano(g.sn,ac,'')}</div></div>`;

  // Chords - each piano starts at C
  h+=`<div class="sec"><button class="tog${show.piano?' on':''}" onclick="tog('piano')">🎹 CHORDS<span class="arr" style="color:${ac}">${show.piano?'▾':'▸'}</span></button><div class="pnl${show.piano?' on':''}">`;
  g.ch.forEach(c=>{h+=piano(c.no,ac,c.n)+`<div class="vo">${c.v}</div>`});
  h+=`</div></div>`;

  h+=`<div class="lh" style="background:${ac}0c;border:1px solid ${ac}30"><div class="ll" style="color:${ac}">🎯 LAND HERE</div><div class="ln">${g.sf}</div></div>`;

  h+=`<div class="sec"><button class="tog${show.sLow?' on':''}" onclick="tog('sLow')">🎸 SCALE — LOW<span class="arr" style="color:${ac}">${show.sLow?'▾':'▸'}</span></button><div class="pnl${show.sLow?' on':''}"><div class="fz" style="color:${ac}">${g.gLow.z}</div><pre>${g.gLow.t}</pre></div></div>`;

  h+=`<div class="sec"><button class="tog${show.sMid?' on':''}" onclick="tog('sMid')">🎸 SCALE — MID<span class="arr" style="color:${ac}">${show.sMid?'▾':'▸'}</span></button><div class="pnl${show.sMid?' on':''}"><div class="fz" style="color:${ac}">${g.gMid.z}</div><pre>${g.gMid.t}</pre></div></div>`;

  h+=`<div class="sec"><button class="tog${show.sHi?' on':''}" onclick="tog('sHi')">🎸 SCALE — HIGH<span class="arr" style="color:${ac}">${show.sHi?'▾':'▸'}</span></button><div class="pnl${show.sHi?' on':''}"><div class="fz" style="color:${ac}">${g.gHi.z}</div><pre>${g.gHi.t}</pre></div></div>`;

  h+=`<div class="sec"><button class="tog${show.cBasic?' on':''}" onclick="tog('cBasic')">🎸 CHORDS — BASIC<span class="arr" style="color:${ac}">${show.cBasic?'▾':'▸'}</span></button><div class="pnl${show.cBasic?' on':''}"><div class="cg">${g.cb.map(c=>chord(c.n,c.fs,c.s,ac)).join('')}</div></div></div>`;

  h+=`<div class="sec"><button class="tog${show.cUp?' on':''}" onclick="tog('cUp')">🎸 CHORDS — UP THE NECK<span class="arr" style="color:${ac}">${show.cUp?'▾':'▸'}</span></button><div class="pnl${show.cUp?' on':''}"><div class="cg">${g.cu.map(c=>chord(c.n,c.fs,c.s,ac)).join('')}</div></div></div>`;

  document.getElementById('app').innerHTML=h;
}
